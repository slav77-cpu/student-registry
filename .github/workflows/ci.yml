name: CI - Student Registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Imeto se smenya za vsyaka versiya — ${{ }} e shablon,
    # koyto GitHub zamestva pri izpulnenie.
    name: Tests on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      # Bez tova, padne li edna versiya, GitHub otmenya ostanalite.
      # Nie iskame da vidim i trite rezultata.
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Vzemi koda
        uses: actions/checkout@v4

      - name: Sloji Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instaliray zavisimostite
        run: npm install

      - name: Pusni testovete
        run: npm test

  # =================================================================
  # CD: deploy v Render — ALA samo ako VSICHKI testove sa minali.
  # =================================================================
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest

    # "needs" e kofarut. Bez nego deploy-ut bi trugnal USPOREDNO
    # s testovete i bi kachil schupen kod, dokato testovete oshte vurvyat.
    needs: test

    # Deployvame samo pri butane v main. Pri pull request testovete
    # vse pak vurvyat, no nishto ne izliza nalive.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.SERVICE_ID }}
          api-key: ${{ secrets.RENDER_TOKEN }}
